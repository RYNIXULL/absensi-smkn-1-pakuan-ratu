version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: absensi_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: absensi_db
    ports:
      - "5432:5432"
    volumes:
      - absensi_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  absensi_pg_data:
